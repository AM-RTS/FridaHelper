plugins {
    id 'com.android.application'
}

android {
    namespace 'com.amrts.fridahelper.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.amrts.fridahelper.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '3.2.0'
    }

    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                props.load(propsFile.newDataInputStream())
                storeFile props['storeFile'] ? rootProject.file(props['storeFile']) : null
                storePassword props['storePassword'] ?: ''
                keyAlias props['keyAlias'] ?: ''
                keyPassword props['keyPassword'] ?: ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':core')

    // AndroidX (bundled with SDK, no third-party)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
}
